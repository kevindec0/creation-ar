# Opcional: ejecuta la app con un Postgres real, como en producción.
#   docker compose up --build
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://creationar:creationar@db:5432/creationar
      DATA_DIR: /app/data
    volumes:
      - uploads:/app/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: creationar
      POSTGRES_PASSWORD: creationar
      POSTGRES_DB: creationar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creationar"]
      interval: 3s
      retries: 10

volumes:
  pgdata:
  uploads:
